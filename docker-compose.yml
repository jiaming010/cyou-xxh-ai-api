services:
  new-api:
    image: cyou-new-api:latest
    container_name: cyou-new-api
    restart: always
    network_mode: host
    command: --log-dir /app/logs
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:${PORT:-3000}/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3